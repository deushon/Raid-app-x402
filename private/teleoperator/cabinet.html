<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Личный кабинет телеоператора</title>
    <link rel="stylesheet" href="/client/styles.css" />
    <link rel="stylesheet" href="/teleoperator/styles.css" />
  </head>
  <body>
    <header>
      <h1>Личный кабинет</h1>
      <p>Телеоператор — заявки помощи и сессия прокси ROSBridge</p>
    </header>
    <main>
      <section class="panel">
        <h2>Открытые заявки</h2>
        <p id="help-error" class="message error hidden"></p>
        <div id="help-list" class="help-list"><p class="hint">Загрузка…</p></div>
      </section>
      <section class="panel">
        <h2>Активная сессия (после «Принять»)</h2>
        <p id="session-hint" class="hint">Примите заявку, чтобы получить WebSocket URL для VR.</p>
        <div id="session-box"></div>
      </section>
      <section class="panel">
        <button type="button" id="logout-btn" class="btn-secondary">Выйти</button>
      </section>
    </main>
    <script src="/teleoperator/cabinet.js"></script>
  </body>
</html>
