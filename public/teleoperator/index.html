<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Teleoperator Home — Task-router-x402</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="min-h-screen flex flex-col">
    <!-- Top Navigation Bar -->
    <nav class="border-b border-slate-800 bg-slate-900/50 backdrop-blur-md sticky top-0 z-50">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between h-16 items-center">
          <a href="/client" class="flex items-center gap-2 hover:opacity-80 transition-opacity">
            <div class="w-8 h-8 bg-indigo-600 rounded-lg flex items-center justify-center font-bold text-white shadow-lg shadow-indigo-500/30">
              TR
            </div>
            <span class="text-xl font-bold bg-gradient-to-r from-white to-slate-400 bg-clip-text text-transparent">Task-router-x402</span>
          </a>
        </div>
      </div>
    </nav>

    <!-- Main Content -->
    <main class="flex-grow flex items-center justify-center p-4">
      <div class="w-full max-w-md">
        <div class="text-center mb-8">
          <h1 class="text-3xl font-bold text-white mb-2">Teleoperator Portal</h1>
          <p class="text-slate-400">Join the network to assist robots remotely and earn SOL for resolving tasks.</p>
        </div>

        <section class="panel shadow-xl shadow-indigo-500/10 border-indigo-500/20">
          <h2 class="text-xl font-semibold mb-6 text-center">Get Started</h2>
          <div class="flex flex-col gap-4">
            <a href="/teleoperator/register.html" class="btn-primary w-full py-3 text-base shadow-lg shadow-indigo-500/20">Create Operator Account</a>
            <div class="relative flex items-center py-2">
              <div class="flex-grow border-t border-slate-700"></div>
              <span class="flex-shrink-0 mx-4 text-slate-500 text-sm">Already registered?</span>
              <div class="flex-grow border-t border-slate-700"></div>
            </div>
            <a href="/teleoperator/login.html" class="btn-secondary w-full py-3 text-base bg-slate-800/80">Sign In to Dashboard</a>
          </div>
        </section>
      </div>
    </main>
  </body>
</html>
