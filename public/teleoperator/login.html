<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Вход телеоператора</title>
    <link rel="stylesheet" href="/client/styles.css" />
    <link rel="stylesheet" href="/teleoperator/styles.css" />
  </head>
  <body>
    <header>
      <h1>Вход</h1>
      <p>Логин и пароль (в будущем — проверка кошельком)</p>
    </header>
    <main>
      <section class="panel">
        <form id="login-form" class="auth-form">
          <label>
            Логин
            <input name="login" type="text" required autocomplete="username" />
          </label>
          <label>
            Пароль
            <input name="password" type="password" required autocomplete="current-password" />
          </label>
          <p id="form-error" class="form-error hidden"></p>
          <button type="submit" class="btn-primary">Войти</button>
        </form>
        <p class="auth-links">Нет аккаунта? <a href="/teleoperator/register.html">Регистрация</a></p>
      </section>
    </main>
    <script src="/teleoperator/login.js"></script>
  </body>
</html>
